<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empório da Música — Chat</title>
<style>
  :root {
    --bg: #f6f1e7; --panel: #fffdf8; --ink: #2b2118; --muted: #76685a;
    --accent: #8c3b1f; --accent-ink: #fffaf2; --line: #e4d9c6; --bot: #f1e8d8; --danger: #a4281c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 760px; height: 100dvh; display: flex; flex-direction: column;
    background: var(--panel); border-inline: 1px solid var(--line);
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  h1 { font: 700 20px/1.2 Georgia, "Times New Roman", serif; margin: 0; }
  .tagline { margin: 2px 0 0; color: var(--muted); font-size: 13px; font-style: italic; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .toggle { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  button { font: inherit; cursor: pointer; }
  .ghost {
    background: none; border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  .ghost:hover { border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .message { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .assistant { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .error { background: none; border: 1px solid var(--danger); color: var(--danger); align-self: center; }
  .error button { margin-left: 8px; color: var(--danger); background: none; border: 0; text-decoration: underline; padding: 0; }
  .debug {
    align-self: flex-start; max-width: 82%; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: var(--muted); border-left: 2px solid var(--line); padding: 2px 10px;
  }
  body:not(.show-debug) .debug { display: none; }
  .typing { color: var(--muted); font-style: italic; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 12px; }
  .chip {
    background: none; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 999px; padding: 6px 12px; font-size: 14px;
  }
  .chip:hover { background: var(--accent); color: var(--accent-ink); }
  form { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit; background: #fff;
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); max-height: 140px;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 18px; font-weight: 600; }
  .send:disabled, textarea:disabled { opacity: .55; cursor: default; }
  @media (max-width: 520px) { .message, .debug { max-width: 92%; } header { padding: 10px 12px; } #log { padding: 12px; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>Empório da Música</h1>
      <p class="tagline">Sua música começa aqui.</p>
    </div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="debugToggle"> Behind the scenes</label>
      <button class="ghost" id="newChat" type="button">New conversation</button>
    </div>
  </header>
  <section id="log" aria-live="polite" aria-label="Conversation"></section>
  <div id="chips"></div>
  <form id="form">
    <textarea id="input" rows="1" maxlength="2000" placeholder="Type your message…" aria-label="Your message"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</main>
<script>
  const WELCOME = "Hi! I'm Tom, the virtual assistant of Empório da Música. Ask me about instruments, prices, your order or store policies. Pode falar em português também!";
  const SUGGESTIONS = [
    "Quais opções de violões disponíveis custando até R$1000?",
    "Qual o endereço da loja?",
    "Quanto custa o Takamine GD20?",
    "Me arrependi da minha compra, posso devolver meu pedido?",
  ];
  const log = document.getElementById("log");
  const chips = document.getElementById("chips");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let busy = false;

  // Model output is only ever inserted as text, never as HTML.
  function add(kind, text) {
    const element = document.createElement("div");
    element.className = `message ${kind}`;
    element.textContent = text;
    log.append(element);
    log.scrollTop = log.scrollHeight;
    return element;
  }

  function addDebug(debug) {
    const element = document.createElement("div");
    element.className = "debug";
    const tools = debug.tools.map(t => `${t.ok ? "✓" : "✗"} ${t.name} (${t.latency_ms} ms)`);
    const lines = tools.length ? tools : ["no tools"];
    lines.push(`${debug.llm_calls} LLM calls · ${debug.input_tokens + debug.output_tokens} tokens · US$ ${debug.cost_usd.toFixed(4)} · ${(debug.latency_ms / 1000).toFixed(1)} s · ${debug.outcome}`);
    element.textContent = lines.join("\n");
    element.style.whiteSpace = "pre-wrap";
    log.append(element);
    log.scrollTop = log.scrollHeight;
  }

  function setBusy(value) {
    busy = value;
    input.disabled = value;
    send.disabled = value;
    if (!value) input.focus();
  }

  function renderChips() {
    chips.replaceChildren(...SUGGESTIONS.map(text => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = text;
      chip.addEventListener("click", () => submit(text));
      return chip;
    }));
  }

  function showError(message, retryText) {
    const element = add("error", message);
    const retry = document.createElement("button");
    retry.type = "button";
    retry.textContent = "Try again";
    retry.addEventListener("click", () => { element.remove(); submit(retryText, false); });
    element.append(retry);
  }

  async function submit(text, echo = true) {
    if (busy || !text.trim()) return;
    if (echo) add("user", text);
    chips.replaceChildren();
    input.value = "";
    setBusy(true);
    const typing = add("assistant typing", "Tom is typing…");
    try {
      const response = await fetch("/api/messages", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text}),
      });
      const body = await response.json();
      typing.remove();
      if (!response.ok) { showError(body.error?.message ?? "Something went wrong.", text); return; }
      add("assistant", body.reply);
      addDebug(body.debug);
    } catch {
      typing.remove();
      showError("Could not reach the server.", text);
    } finally {
      setBusy(false);
    }
  }

  async function start() {
    log.replaceChildren();
    add("assistant", WELCOME);
    const response = await fetch("/api/history");
    const {messages} = await response.json();
    messages.forEach(m => add(m.role, m.content));
    if (messages.length === 0) renderChips(); else chips.replaceChildren();
    input.focus();
  }

  form.addEventListener("submit", event => { event.preventDefault(); submit(input.value); });
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
  });
  document.getElementById("debugToggle").addEventListener("change", event => {
    document.body.classList.toggle("show-debug", event.target.checked);
  });
  document.getElementById("newChat").addEventListener("click", async () => {
    await fetch("/api/reset", {method: "POST"});
    start();
  });
  start();
</script>
</body>
</html>
