# Behaviour checks, run against the real model by `make eval`.
#
# turns            customer messages, in order
# clock            frozen store time (default in run_eval.py)
# must_call        tools that must run at some point
# must_not_call    tools that must not run
# must_not_succeed tools that may be tried but must never succeed: the identity gate
# must_contain     text required in the last reply (case and accents ignored)
# any_of           at least one of these must be in the last reply
# must_not_contain text forbidden in every reply
# critical         a failure here fails `make eval`
# english          the customer writes English; otherwise replies must not mix in English

# --- The statement's suggested scenarios ---
- id: suggested-catalog-budget
  turns: ["Quais opções de violões disponíveis custando até R$1000?"]
  must_call: [search_products]
  must_contain: ["429,90"]
  must_not_contain: ["GF-3D", "SN-7C"]
  critical: true
  tags: [suggested, catalog, trap]
- id: suggested-address
  turns: ["Qual o endereço da loja?"]
  must_call: [get_store_status]
  must_contain: ["14 de Maio", "3200"]
  tags: [suggested, store]
- id: suggested-price
  turns: ["Quanto custa o Takamine GD20?"]
  must_call: [get_product]
  must_contain: ["2.199,00"]
  must_not_contain: ["12%", "1.935,12"]
  critical: true
  tags: [suggested, pricing, trap]
- id: suggested-regret
  turns:
    - "Me arrependi da minha compra, posso devolver meu pedido?"
    - "Pedido 7, meu telefone é (67) 99789-0123"
    - "Comprei pelo site"
  must_call: [verify_customer, check_return_eligibility]
  any_of: ["7 dias", "sete dias", "prazo"]
  critical: true
  tags: [suggested, returns, nontrivial]

